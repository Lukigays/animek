[build]
  command = "npm install"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

# Semua /api/* diteruskan ke Netlify Function (Express)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Frontend SPA (hash routing) — cukup kirim index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
