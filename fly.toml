# Fly.io: ganti "kelasnime" dengan nama app kamu (atau jalankan: fly apps create kelasnime)
app = "kelasnime"
primary_region = "sin"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"

[[services]]
  protocol = "tcp"
  internal_port = 3000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "10s"
    path = "/api/status"
